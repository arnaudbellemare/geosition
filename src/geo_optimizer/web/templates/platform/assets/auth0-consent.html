<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connect an AI service · GEOSITION</title>
  <link rel="stylesheet" href="/platform/assets/site.css">
  <style>
    .consent-card { width: min(480px, 100%); }
    .consent-content { padding: 0 1.5rem 1.5rem; }
    .consent-content h1 { margin: .25rem 0 .5rem; }
    .consent-content h2 { margin: 0 0 .5rem; font-size: 1.05rem; line-height: 1.35; }
    .consent-content p { margin: 0; line-height: 1.5; }
    .consent-content .intro { color: var(--muted); font-size: .9rem; }
    .consent-content section { margin-top: 1.5rem; }
    .consent-content .identity { margin-top: .75rem; color: var(--muted); font-size: .84rem; overflow-wrap: anywhere; }
    .consent-content .identity code { color: var(--ink); font: inherit; }
    .consent-content form { padding: 0; }
    .consent-content fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
    .consent-content legend { padding: 0; font-size: .85rem; font-weight: 600; }
    .auth-card .consent-option { display: flex; align-items: flex-start; gap: .75rem; margin: .75rem 0 0; padding: .8rem; border: 1px solid var(--line); border-radius: 8px; line-height: 1.4; cursor: pointer; }
    .auth-card .consent-option input { flex: 0 0 auto; width: 1.1rem; height: 1.1rem; min-height: 0; margin: .1rem 0 0; padding: 0; accent-color: var(--ink); }
    .consent-actions { display: grid; gap: .65rem; margin-top: 1.25rem; }
    .auth-card .consent-actions button { width: 100%; min-height: 2.75rem; margin: 0; padding: .65rem 1rem; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--ink); font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; }
    .auth-card .consent-actions button[type="submit"] { border-color: var(--ink); background: var(--ink); color: #fff; }
    .auth-card .consent-actions button:hover { filter: brightness(.95); transform: none; }
    .consent-switch { display: inline-block; margin-top: 1.1rem; font-size: .85rem; color: var(--muted); }
    .consent-content .err:empty { display: none; }
    @media (max-width: 420px) { .consent-content { padding: 0 1.25rem 1.25rem; } }
  </style>
</head>
<body>
  <main class="auth-page">
    <div class="auth-card consent-card">
      <a class="auth-brand" href="/platform">GEOSITION</a>
      <div class="consent-content">
        <h1>Connect your workspace</h1>
        <p class="intro">Sign in and review what this AI service can do.</p>
        <p id="message" class="err" role="status" aria-live="polite"></p>
        <section id="sign-in" hidden>
          <h2>Sign in to GEOSITION</h2>
          <form id="login">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <button type="submit">Continue</button>
          </form>
        </section>
        <section id="review" hidden>
          <h2>Review access</h2>
          <p><strong id="client"></strong> wants to connect to <strong id="workspace"></strong>.</p>
          <p class="identity">Signed-in AI identity: <code id="identity"></code></p>
          <form id="approve">
            <fieldset>
              <legend>Workspace access</legend>
              <label class="consent-option"><input id="read" type="checkbox" checked><span>Read setup and audit results</span></label>
              <label class="consent-option"><input id="write" type="checkbox"><span>Run audits and update setup progress</span></label>
            </fieldset>
            <div class="consent-actions">
              <button type="submit">Approve connection</button>
              <button id="deny" type="button">Don't connect</button>
            </div>
          </form>
          <a class="consent-switch" href="/platform/dashboard">Choose a different workspace</a>
        </section>
      </div>
    </div>
  </main>
  <script src="/platform/assets/auth0-consent.js?v=2" defer></script>
</body>
</html>
