repos:
  - repo: local
    hooks:
      - id: gitleaks-files
        name: Detect secrets in changed files
        entry: python3 scripts/check_hook_files.py secrets
        language: system
        types: [text]
      - id: syntax-files
        name: Check Python, JavaScript, JSON and shell syntax
        entry: python3 scripts/check_hook_files.py syntax
        language: system
        files: '\.(py|mjs|cjs|js|json|sh)$'
      - id: shellcheck
        name: ShellCheck warnings
        entry: shellcheck --severity=warning
        language: system
        files: '\.sh$'
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: python
        additional_dependencies: [ruff==0.17.4]
        files: '^src/geo_optimizer/.*\.py$'
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: python
        additional_dependencies: [ruff==0.17.4]
        files: '^src/geo_optimizer/.*\.py$'
